<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Cycler</title>
</head>
<body>

    <main>
        <section class="card" id="mainCard">
            <h1 id="mainTitle">DOM Practice</h1>
            <p id="description">
                This text will be updated later on by using Js
                <strong>Java Script</strong>
            </p>
            <div class="info-row">
                <div class="badge">Selectors</div>
                <div class="badge">textContent</div>
                <div class="badge">Styles</div>
                <div class="badge">Create / Remove</div>
            </div>

            <h2 class="list-Title" id="listTitle">Sample Items</h2>
            <ul id="itemList" class="item-List">
                <li class="item">Item 1</li>
                <li class="item">Item 2</li>
                <li class="item">Item 3</li>
            </ul>
            <p class="hint">
                Open <code>review.js</code> and follow each step
            </p>
        </section>
    </main>
    <h3>Smart Shopping List</h3>
    <input id="itemName" placeholder="Item Name">
    <input id="itemPrice" type="number" placeholder="Price">
    <button id="addBtn"> Add Item</button>

    <h3>Your List</h3>
    <ul id="list"></ul>

    <button id="sowPending">Show Pending Only</button>
    <button id="showAll">Show All</button>

    <p id="total">Total= 0.00</p>
    
    <script src="review.js"></script>
</body> 

<script src="review.js"></script>
</html>
